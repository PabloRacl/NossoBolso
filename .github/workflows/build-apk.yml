name: Compilar APK Android (NossoBolso)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Gerar APK Instalável
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Dependências do Projeto
        run: npm ci

      - name: Compilar Build Web (Vite + TypeScript)
        run: npm run build

      - name: Gerar Ícones Oficiais e Telas de Abertura
        run: node scripts/generate-icons.mjs

      - name: Sincronizar com Capacitor Android
        run: npx cap sync android

      - name: Conceder Permissão de Execução ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Android (Gradle assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Renomear e Preparar APK Final
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/NossoBolso-v2.1.0-debug.apk

      - name: Disponibilizar APK para Download (GitHub Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: NossoBolso-Android-APK
          path: build-output/NossoBolso-v2.1.0-debug.apk
          retention-days: 30
