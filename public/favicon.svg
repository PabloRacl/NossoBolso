<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>

    <!-- Banknote Gradient -->
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Dollar Badge Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glowing Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#10B981" stroke-opacity="0.3" stroke-width="8" />

  <!-- MAIN BANKNOTE CARD (Top Section) -->
  <g filter="url(#glow)">
    <!-- Outer Card Frame -->
    <rect x="86" y="80" width="340" height="200" rx="36" fill="url(#noteGrad)" stroke="#34D399" stroke-width="12" />
    <!-- Inner Card Line Accent -->
    <rect x="106" y="100" width="300" height="160" rx="24" fill="none" stroke="#A7F3D0" stroke-opacity="0.4" stroke-width="6" stroke-dasharray="12 8" />
    
    <!-- Banknote Side Circles -->
    <circle cx="136" cy="180" r="18" fill="#047857" opacity="0.6" />
    <circle cx="376" cy="180" r="18" fill="#047857" opacity="0.6" />

    <!-- Center Currency Badge ($) -->
    <circle cx="256" cy="180" r="50" fill="url(#goldGrad)" stroke="#FEF08A" stroke-width="8" />
    <!-- Dollar Sign -->
    <path d="M256 148 V212 M240 162 C240 154 272 150 272 166 C272 182 240 178 240 194 C240 210 272 206 272 198" 
          stroke="#78350F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- BRANCHING FLOW CONNECTORS (Bottom Section) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Vertical Trunk Line -->
    <path d="M256 280 V360" stroke="#38BDF8" stroke-width="14" />

    <!-- Horizontal Distribution Line -->
    <path d="M146 360 H366" stroke="#38BDF8" stroke-width="14" />

    <!-- Vertical Drops to Nodes -->
    <path d="M146 360 V400" stroke="#EF4444" stroke-width="12" />
    <path d="M256 360 V400" stroke="#3B82F6" stroke-width="12" />
    <path d="M366 360 V400" stroke="#F59E0B" stroke-width="12" />
  </g>

  <!-- ACCOUNT FLOW NODES -->
  <!-- Left Node (Receitas/Saídas - Red) -->
  <circle cx="146" cy="416" r="28" fill="#EF4444" stroke="#FCA5A5" stroke-width="8" />
  <circle cx="146" cy="416" r="10" fill="#FFFFFF" />

  <!-- Center Node (Carteira Principal - Blue) -->
  <circle cx="256" cy="416" r="32" fill="#3B82F6" stroke="#93C5FD" stroke-width="8" />
  <circle cx="256" cy="416" r="12" fill="#FFFFFF" />

  <!-- Right Node (Poupança/Metas - Gold) -->
  <circle cx="366" cy="416" r="28" fill="#F59E0B" stroke="#FDE68A" stroke-width="8" />
  <circle cx="366" cy="416" r="10" fill="#FFFFFF" />
</svg>
